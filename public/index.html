<!doctype html>
<meta charset="utf-8">
<title>Plate</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    color-scheme: dark;
    /* surfaces */
    --bg: #07100f; --bg-glow-1: #123a33; --bg-glow-2: #2a2414;
    --surface: rgb(255 255 255 / .035); --surface-2: rgb(255 255 255 / .06); --surface-3: rgb(255 255 255 / .09);
    --line: rgb(255 255 255 / .08); --line-2: rgb(255 255 255 / .14);
    /* text */
    --text: #eef3f0; --text-2: #aab8b2; --text-3: #72837c;
    /* semantic: accent is reserved for "needs you" */
    --accent: #ffa56e; --accent-soft: rgb(255 165 110 / .12); --accent-line: rgb(255 165 110 / .38); --accent-ink: #2a1708;
    --late: #f0707f; --today: #e8c35a; --live: #5fd3a2;
    --pr: #56d364; --pr-merged: #a371f7; /* GitHub's own semantics: open PR green, merged purple, closed red */ --issue: #7fb5f0; --todo: #8fd0c4; --sess: #e7e2d4;
    /* type scale */
    --fs-xs: 11px; --fs-sm: 12.5px; --fs-md: 14px; --fs-lg: 17px; --fs-xl: 24px; --fs-2xl: 34px;
    --font: ui-sans-serif, -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    /* space + shape */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --r-sm: 8px; --r-md: 14px; --r-lg: 20px;
    --dock-h: 96px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    font: var(--fs-md)/1.45 var(--font); color: var(--text); margin: 0; min-height: 100vh;
    background:
      radial-gradient(1100px 520px at 18% -8%, var(--bg-glow-1), transparent 70%),
      radial-gradient(900px 420px at 100% 108%, var(--bg-glow-2), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-line); }
  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 9px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.sm { width: 14px; height: 14px; }

  /* ---------- top bar ---------- */
  header.top { display: flex; align-items: center; gap: var(--s5); padding: var(--s5) var(--s6) var(--s3); }
  .brand { font-size: var(--fs-md); font-weight: 600; letter-spacing: .02em; }
  .brand span { color: var(--text-3); font-weight: 400; }
  .clock { margin-left: auto; font-size: var(--fs-2xl); font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .date { color: var(--text-2); font-size: var(--fs-sm); line-height: 1.3; }
  .date b { display: block; color: var(--text); font-weight: 600; font-size: var(--fs-md); }
  .stats { display: flex; gap: var(--s2); padding: var(--s2); border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); backdrop-filter: blur(14px); }
  .stat { display: flex; flex-direction: column; padding: 6px var(--s4); border-radius: var(--r-md); min-width: 84px; }
  .stat b { font-size: var(--fs-xl); font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: var(--fs-xs); color: var(--text-3); letter-spacing: .06em; text-transform: uppercase; }
  .stat.need { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
  .stat.need b, .stat.need span { color: var(--accent); }
  .stat.need.zero { background: none; box-shadow: none; } .stat.need.zero b, .stat.need.zero span { color: var(--text-3); }
  .stat.link { cursor: pointer; }

  main { padding: var(--s3) var(--s6) calc(var(--dock-h) + var(--s6)); }

  /* ---------- dock ---------- */
  nav.dock {
    position: fixed; left: 50%; bottom: var(--s5); transform: translateX(-50%); z-index: 10;
    display: flex; gap: var(--s2); padding: var(--s2);
    border: 1px solid var(--line-2); border-radius: var(--r-lg);
    background: rgb(10 20 18 / .72); backdrop-filter: blur(20px) saturate(1.3);
    box-shadow: 0 18px 50px rgb(0 0 0 / .5);
  }
  nav.dock button {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px;
    width: 92px; padding: 10px 0 8px; border: 1px solid transparent; border-radius: var(--r-md);
    background: none; color: var(--text-3); font: 500 var(--fs-xs)/1 var(--font); letter-spacing: .04em; cursor: pointer;
    transition: color .15s, background .15s;
  }
  nav.dock button:hover { color: var(--text); background: var(--surface); }
  nav.dock button.on { color: var(--text); background: var(--surface-2); border-color: var(--line-2); }
  nav.dock button.on::after { content: ""; position: absolute; left: 24px; right: 24px; bottom: -9px; height: 2px; border-radius: 2px; background: var(--text); opacity: .85; }
  nav.dock button .pip { position: absolute; top: 5px; right: 20px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 10.5px; font-weight: 700; line-height: 18px; text-align: center; }
  nav.dock .sep { width: 1px; background: var(--line); margin: 8px 2px; }


  /* ---------- cards ---------- */
  .card {
    --k: var(--text-2);
    position: relative; margin-bottom: var(--s2); padding: var(--s3) var(--s3) var(--s3) var(--s4);
    border: 1px solid var(--line); border-radius: var(--r-md); background: rgb(14 24 22 / .72);
    cursor: grab; transition: transform .15s, border-color .15s, background .15s;
  }
  .card:hover { border-color: var(--line-2); background: rgb(20 32 29 / .85); transform: translateY(-1px); }
  .card::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--k); opacity: .75; }
  .card.k-todoist { --k: var(--todo); } .card.k-pr { --k: var(--pr); } .card.k-issue { --k: var(--issue); } .card.k-session { --k: var(--sess); } .card.k-teams { --k: #9db4ff; } .card.k-link { --k: #7fd0e0; } .card.k-note { --k: #d9c79a; } .card.k-draft { --k: var(--text-3); }
  .gh-merged { --k: var(--pr-merged) !important; } .gh-closed { --k: var(--late) !important; }
  .card.dragging { opacity: .35; transform: scale(.98); }
  .card.done { opacity: .5; } .card.done .ttl { text-decoration: line-through; text-decoration-color: var(--text-3); }
  .card .kind { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--k); }
  .card .kind .ref { margin-left: auto; font: 500 var(--fs-xs) var(--mono); letter-spacing: 0; text-transform: none; color: var(--text-3); }
  .card .ttl { color: var(--text); text-decoration: none; font-size: var(--fs-md); font-weight: 500; line-height: 1.38; display: block; overflow-wrap: anywhere; }
  .card .ttl:hover { text-decoration: underline; text-decoration-color: var(--text-3); text-underline-offset: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s3); align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); font-size: var(--fs-xs); line-height: 1.6; white-space: nowrap; }
  .chip.dim { color: var(--text-3); background: none; box-shadow: inset 0 0 0 1px var(--line); }
  .chip.late { color: var(--late); background: rgb(240 112 127 / .12); }
  .chip.today { color: var(--today); background: rgb(232 195 90 / .12); }
  .chip.soon { color: var(--text-2); }
  .chip.ws { color: var(--text-2); margin-left: auto; }

  /* session states */
  .state { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st-waiting { color: var(--accent); } .st-running { color: var(--live); } .st-done { color: var(--text-3); } .st-idle { color: var(--text-2); }
  .st-running::before { animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgb(95 211 162 / .6); } 100% { box-shadow: 0 0 0 8px rgb(95 211 162 / 0); } }
  @media (prefers-reduced-motion: reduce) { .st-running::before { animation: none; } }
  .card.need::before { background: var(--accent); opacity: 1; }
  .card.need.k-session { border-color: var(--accent-line); background: linear-gradient(135deg, rgb(255 165 110 / .13), rgb(14 24 22 / .8) 60%); box-shadow: 0 0 28px -8px rgb(255 165 110 / .4); }
  .card.need .state { padding: 2px 9px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); }
  .card.need .state::before { background: var(--accent-ink); }

  /* ---------- needs you ---------- */
  .page-h { margin: var(--s3) 0 var(--s5); }
  .page-h h2 { margin: 0; font-size: var(--fs-xl); font-weight: 600; letter-spacing: -.02em; }
  .page-h p { margin: 4px 0 0; color: var(--text-3); font-size: var(--fs-sm); }
  .needs { max-width: 720px; }
  .needs .card { padding: var(--s4) var(--s4) var(--s4) var(--s5); }
  .needs .card .ttl { font-size: var(--fs-lg); }
  .empty { color: var(--text-3); padding: var(--s6); border: 1px dashed var(--line-2); border-radius: var(--r-lg); max-width: 720px; text-align: center; }

  /* ---------- workstreams mindmap ---------- */
  :root { --pw: min(720px, calc(100vw - 24px)); }
  .ws-main { transition: margin-right .28s ease; }
  .ws-bar { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-bottom: var(--s4); }
  .ws-bar .page-h { margin: 0 auto 0 0; }
  input, select, button.btn { font: var(--fs-sm) var(--font); color: var(--text); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 6px 10px; }
  input:focus, select:focus { outline: none; border-color: var(--text-2); }
  select option { background: #10201d; }
  button.btn { cursor: pointer; } button.btn:hover { background: var(--surface-3); }
  button.btn.ghost { background: none; color: var(--text-2); }
  .rootzone { padding: 6px 14px; border: 1px dashed var(--line-2); border-radius: 99px; color: var(--text-3); font-size: var(--fs-xs); letter-spacing: .06em; text-transform: uppercase; }
  .rootzone.over { border-color: var(--text); color: var(--text); background: var(--surface-2); }
  .canvas-scroll { display: flex; overflow: auto; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: var(--s4); box-sizing: border-box; }
  .canvas { position: relative; }
  .canvas svg { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .edge { fill: none; stroke: var(--line-2); stroke-width: 1.6; }
  .edge.rel { stroke: var(--text-3); stroke-width: 1.3; stroke-dasharray: 4 5; opacity: .85; }
  .edge.hl { stroke: var(--text-2); opacity: 1; }
  .wnode {
    position: absolute; padding: 10px 14px; border: 1px solid var(--line-2); border-radius: var(--r-md);
    background: rgb(14 24 22 / .92); cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 6px;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .wnode:hover { background: rgb(22 36 33 / .95); }
  .wnode.sel { border-color: var(--text); box-shadow: 0 0 0 3px rgb(255 255 255 / .08); }
  .wnode.over { border-color: var(--live); box-shadow: 0 0 0 3px rgb(95 211 162 / .2); }
  .wnode.need { border-color: var(--accent-line); box-shadow: 0 0 22px -8px rgb(255 165 110 / .5); }
  .wnode.need.sel { border-color: var(--accent); }
  .wnode.paused { opacity: .7; } .wnode.done { opacity: .45; }
  .wnode.done .wn { text-decoration: line-through; text-decoration-color: var(--text-3); }
  .wn { font-weight: 600; font-size: var(--fs-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wrow { display: flex; gap: 6px; align-items: center; }
  .wnode.dragging { opacity: .35; }
  .addteams { display: grid; gap: 6px; margin-top: var(--s3); }
  .addteams summary { cursor: pointer; color: var(--text-3); font-size: var(--fs-xs); letter-spacing: .1em; text-transform: uppercase; }
  .hint { color: var(--text-3); font-size: var(--fs-sm); margin: var(--s3) 0 0; }
  .toast { position: fixed; top: var(--s4); left: 50%; transform: translateX(-50%); z-index: 20; padding: 8px 16px; border-radius: 99px; background: var(--late); color: #2a0a10; font-size: var(--fs-sm); font-weight: 600; }


  /* ---------- workstream focus ---------- */
  .chip.need { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-line); font-weight: 600; }
  .focus { max-width: 1120px; margin: 0 auto; padding-bottom: var(--s5); }
  .focus.enter { animation: focusin .32s ease both; }
  @keyframes focusin { from { opacity: 0; transform: scale(.985) translateY(10px); } }
  @media (prefers-reduced-motion: reduce) { .focus.enter { animation: none; } }
  .crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: var(--s2) 0 var(--s5); color: var(--text-3); font-size: var(--fs-sm); }
  .crumb button { background: none; border: 0; color: var(--text-2); font: inherit; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
  .crumb button:hover { background: var(--surface-2); color: var(--text); } .crumb b { color: var(--text); font-weight: 600; }
  .crumb.solo { max-width: 1120px; margin-left: auto; margin-right: auto; }
  .crumb .esc { margin-left: auto; font-size: var(--fs-xs); letter-spacing: .06em; text-transform: uppercase; }
  .fhead h1 { margin: 0 0 var(--s3); font-size: var(--fs-2xl); font-weight: 600; letter-spacing: -.03em; line-height: 1.1; }
  .fbody { margin: var(--s3) 0 0; max-width: 62ch; color: var(--text-2); }
  .subrow { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); margin-top: var(--s4); }
  .subrow > span { width: 64px; font-size: var(--fs-xs); letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
  .fsec { margin-top: var(--s6); }
  .fsec h3 { display: flex; align-items: baseline; gap: var(--s3); margin: 0 0 4px; font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.01em; }
  .fsec h3 span { font-size: var(--fs-sm); font-weight: 500; color: var(--text-3); }
  .fsec > p { margin: 0 0 var(--s4); color: var(--text-3); font-size: var(--fs-sm); }
  .fsec.need { padding: var(--s4) var(--s5) var(--s5); border: 1px solid var(--accent-line); border-radius: var(--r-lg); background: linear-gradient(180deg, var(--accent-soft), transparent 70%); }
  .fsec.need h3, .fsec.need h3 span { color: var(--accent); }
  .fdone { margin-top: var(--s6); color: var(--text-3); } .fdone summary { cursor: pointer; font-size: var(--fs-sm); margin-bottom: var(--s3); }
  .fdone .igrid { opacity: .7; }
  .cact { margin-left: auto; display: inline-flex; gap: 6px; opacity: 0; transition: opacity .15s; }
  .card:hover .cact, .cact:focus-within { opacity: 1; }
  .cact select { padding: 2px 6px; font-size: var(--fs-xs); max-width: 110px; }
  .cact button { background: none; border: 0; color: var(--text-3); cursor: pointer; } .cact button:hover { color: var(--late); }
  .igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: var(--s3); }
  .igrid .card { margin: 0; } .igrid .none { grid-column: 1 / -1; }
  .subs { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .sub-ws { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 8px 14px; border: 1px solid var(--line-2); border-radius: var(--r-md); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
  .sub-ws:hover { background: var(--surface-2); } .sub-ws span { color: var(--text-3); font-size: var(--fs-xs); }
  .sub-ws.need { border-color: var(--accent-line); } .sub-ws.need span { color: var(--accent); }
  details.props { margin-top: var(--s4); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); }
  details.props summary { cursor: pointer; padding: 10px 14px; color: var(--text-2); font-size: var(--fs-sm); }
  details.props .f { padding: 0 14px 14px; margin: 0; }
  .f { display: grid; grid-template-columns: 86px 1fr; gap: var(--s2) var(--s3); align-items: center; font-size: var(--fs-sm); color: var(--text-3); }
  .f input, .f select { width: 100%; min-width: 0; }
  .rels { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  a.btn { text-decoration: none; display: inline-block; font: var(--fs-sm) var(--font); color: var(--text); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 6px 12px; }
  button.btn.danger { color: var(--late); }
  .toast.ok { display: flex; gap: 14px; align-items: center; background: rgb(14 24 22 / .96); color: var(--text); border: 1px solid var(--line-2); box-shadow: 0 10px 40px rgb(0 0 0 / .5); z-index: 30; }
  .toast.ok button { font: inherit; font-weight: 600; background: none; border: 0; color: var(--accent); cursor: pointer; }

  /* ---------- Inbox side panel (Workstreams view): triage list, drag rows onto the map ---------- */
  .wsx.with-panel { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: var(--s4); align-items: start; }
  .ipanel { position: sticky; top: var(--s3); max-height: calc(100vh - var(--dock-h) - 110px); overflow-y: auto; padding: var(--s3); border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
  .ipanel .tri-bar { margin-bottom: var(--s3); } .ipanel .page-h { flex: 0 0 100%; } .ipanel .page-h h2 { margin: 0; font-size: var(--fs-lg); }
  .ipanel #tq { flex: 0 0 100%; box-sizing: border-box; }
  .ipanel .tgrp { margin-bottom: var(--s3); }
  .ipanel .trow { grid-template-columns: 22px 16px minmax(0, 1fr); cursor: grab; } .ipanel .trow .m { grid-column: 3; flex-wrap: wrap; } .ipanel .trow .m:empty { display: none; }
  .trow { position: relative; } .ipanel .trow .ctxbtn { margin-left: 0; }
  .trow .dis { position: absolute; right: 8px; top: 6px; font: inherit; color: var(--text-3); background: none; border: 0; border-radius: 6px; padding: 0 5px; cursor: pointer; visibility: hidden; }
  .trow:hover .dis { visibility: visible; } .trow .dis:hover { color: var(--text); background: var(--surface-3); }
  .fhead.over, .sub-ws.over { outline: 2px solid var(--live); outline-offset: 4px; border-radius: var(--r-md); }
  @media (max-width: 900px) { .wsx.with-panel { grid-template-columns: 1fr; } .ipanel { position: static; max-height: 50vh; } }
  .tri-bar { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-bottom: var(--s4); }
  .tri-bar .page-h { margin: 0 auto 0 0; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); }
  .seg button { font: 500 var(--fs-xs) var(--font); color: var(--text-3); background: none; border: 0; border-radius: 99px; padding: 4px 11px; cursor: pointer; }
  .seg button.on { background: var(--surface-3); color: var(--text); }
  .tgrp { margin-bottom: var(--s4); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); overflow: hidden; }
  .tgrp > h4 { display: flex; align-items: center; gap: var(--s2); margin: 0; padding: 8px 12px; font: 600 var(--fs-xs)/1.4 var(--mono); color: var(--text-2); border-bottom: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
  .tgrp > h4 span { margin-left: auto; font-family: var(--font); color: var(--text-3); font-weight: 500; }
  .trow { --k: var(--text-2); display: grid; grid-template-columns: 22px 16px minmax(0, 1fr) auto; gap: var(--s2); align-items: center; padding: 7px 12px; border-top: 1px solid var(--line); cursor: pointer; }
  .trow:first-of-type { border-top: 0; }
  .trow:hover { background: var(--surface-2); }
  .trow.sel { background: rgb(95 211 162 / .09); }
  .trow .g { color: var(--k); display: flex; }
  .trow .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow .t a { color: var(--text); text-decoration: none; } .trow .t a:hover { text-decoration: underline; text-decoration-color: var(--text-3); }
  .trow .m { display: flex; gap: 6px; align-items: center; }
  .trow.k-todoist { --k: var(--todo); } .trow.k-pr { --k: var(--pr); } .trow.k-issue { --k: var(--issue); } .trow.k-session { --k: var(--sess); } .trow.k-teams { --k: #9db4ff; } .trow.k-link { --k: #7fd0e0; } .trow.k-note { --k: #d9c79a; } .trow.k-draft { --k: var(--text-3); }
  input[type=checkbox] { accent-color: var(--live); margin: 0; }
  .tri-act { position: fixed; left: 50%; bottom: calc(var(--dock-h) + var(--s3)); transform: translateX(-50%); z-index: 11; display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; padding: 10px 12px 10px 16px;

  const head = `<div class="page-h"><h2>Needs you</h2><p>${list.length} waiting on you, sessions and deadlines first</p></div>`;
  if (!list.length) return head + '<div class="empty">Nothing waiting on you.</div>';
  const name = (s) => S.workstreams.find((w) => w.slug === s)?.name;
  return `${head}<div class="needs">${list.map((i) => card(i, false, i.workstream ? `<span class="chip ws">▸ ${esc(name(i.workstream))}</span>` : '')).join('')}</div>`;
}
// ---------- workstreams (mindmap + drill-in) ----------
const NW = 176, R0 = 140, RG = 96, AX = 1.9, PAD = 40; // radial mindmap: max box width, first ring, ring gap (vertical), ring x-stretch, margin
// one color per top-level branch; amber stays reserved for "needs you"
const BRANCH = ['#7fb5f0', '#e58a9b', '#8fd0c4', '#b69cf5', '#a3cf72', '#d9c79a', '#f0a6d8', '#7fd0e0', '#9db4ff', '#c9b37a'];
// keyed by the root's slug (not its position), so adding a workstream doesn't repaint the others; `color:` in the .md overrides
const branchColor = (w) => w.color || BRANCH[[...w.slug].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % BRANCH.length];
const post = async (url, body) => {
  const r = await fetch(url, { method: 'POST', body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { toast(j.error || 'failed'); return null; }
  return j;
};
function toast(msg, undo, label = 'Undo') {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (undo ? ' ok' : ''); t.textContent = msg;
  if (undo) { const b = document.createElement('button'); b.textContent = label; b.onclick = () => { t.remove(); undo(); }; t.append(b); }
  document.body.append(t); setTimeout(() => t.remove(), undo ? 7000 : 3200);
}
const wsOf = (slug) => S.workstreams.find((w) => w.slug === slug);
const wsStats = (slug) => { const m = S.items.filter((i) => i.workstream === slug); return { n: m.length, need: m.filter((i) => i.needsYou).length }; };

// Radial layout: top-level workstreams on an elliptical ring around the center node; each subtree gets an
// angle slice proportional to its leaves and continues outward on further rings.
function layoutWs() {
  const slugs = new Set(S.workstreams.map((w) => w.slug));
  const kids = (p) => S.workstreams.filter((w) => (w.parent && slugs.has(w.parent) ? w.parent : null) === p);
  const leaves = new Map();
  const count = (w, seen) => { seen.add(w.slug); const ch = kids(w.slug).filter((c) => !seen.has(c.slug)); const n = ch.length ? ch.reduce((t, c) => t + count(c, seen), 0) : 1; leaves.set(w.slug, n); return n; };
  const seen0 = new Set(), roots = kids(null);
  roots.forEach((r) => count(r, seen0));
  S.workstreams.filter((w) => !seen0.has(w.slug)).forEach((w) => { roots.push(w); count(w, seen0); }); // broken/cyclic parents surface as roots
  const total = Math.max(1, roots.reduce((t, r) => t + leaves.get(r.slug), 0));
  const r1 = Math.max(R0, (total * 100) / (2 * Math.PI * (1 + AX) / 2)); // ~100px of ring perimeter per leaf
  const pos = new Map(), seen = new Set();
  const place = (w, d, a0, a1, color) => {
    seen.add(w.slug);
    const a = (a0 + a1) / 2, r = r1 + RG * (1 - 0.75 ** d) / 0.25; // each deeper ring 25% closer than the previous gap
    pos.set(w.slug, { x: r * AX * Math.cos(a), y: r * Math.sin(a), d, a, color });
    let at = a0;
    for (const c of kids(w.slug).filter((c) => !seen.has(c.slug))) { const span = ((a1 - a0) * leaves.get(c.slug)) / leaves.get(w.slug); place(c, d + 1, at, at + span, color); at += span; }
  };
  let at = -Math.PI / 2 - Math.PI / Math.max(roots.length, 2); // start a little before 12 o'clock so a lone branch isn't vertical
  // a branch fans out over at most half the circle, so a lone big branch doesn't wrap around the center
  roots.forEach((r) => { const share = (2 * Math.PI * leaves.get(r.slug)) / total, span = Math.min(share, Math.PI); place(r, 0, at + (share - span) / 2, at + (share + span) / 2, branchColor(r)); at += share; });
  // tight bounding box around the center node and every box (a one-sided map doesn't reserve the empty side)
  let x0 = -90, x1 = 90, y0 = -30, y1 = 30;
  for (const p of pos.values()) { x0 = Math.min(x0, p.x - NW / 2); x1 = Math.max(x1, p.x + NW / 2); y0 = Math.min(y0, p.y - 26); y1 = Math.max(y1, p.y + 26); }
  const cx = PAD / 2 - x0, cy = PAD / 2 - y0;
  for (const p of pos.values()) { p.x += cx; p.y += cy; }
  return { pos, w: x1 - x0 + PAD, h: y1 - y0 + PAD, cx, cy };
}
// Curves leave the parent along the line toward the child and arrive horizontally (side nodes) or vertically (top/bottom).
const curve = (ax, ay, bx, by) => {
  const dx = bx - ax, dy = by - ay, side = Math.abs(dx) > Math.abs(dy) * 1.2;
  const c2 = side ? [bx - dx * 0.45, by] : [bx, by - dy * 0.45];
  return `M${ax} ${ay} C${ax + dx * 0.35} ${ay + dy * 0.35} ${c2[0]} ${c2[1]} ${bx} ${by}`;
};
function edgesSvg(L, heat = new Map()) {
  let out = '';
  for (const w of S.workstreams) {
    const b = L.pos.get(w.slug); if (!b) continue;
    const a = L.pos.get(w.parent) || { x: L.cx, y: L.cy };
    out += `<path class="edge br ${heat.has(w.slug) ? 'lit' : ''}" style="--b:${b.color}" d="${curve(a.x, a.y, b.x, b.y)}"/>`;
  }
  const done = new Set();
  for (const w of S.workstreams) for (const r of w.related) {
    const key = [w.slug, r].sort().join('|');
    const a = L.pos.get(w.slug), b = L.pos.get(r);
    if (done.has(key) || !a || !b) continue;
    done.add(key);
    const hl = selWs && (w.slug === selWs || r === selWs) ? ' hl' : '';
    const [qx, qy] = [L.cx + ((a.x + b.x) / 2 - L.cx) * 0.4, L.cy + ((a.y + b.y) / 2 - L.cy) * 0.4]; // bow toward the center
    out += `<path class="edge rel${hl}" d="M${a.x} ${a.y} Q${qx} ${qy} ${b.x} ${b.y}"/>`;
  }
  return out;
}
// ---------- workstream focus: click a node → full-area view of that one workstream ----------
const SAFE_URL = /^(https?|msteams|devin):\/\//i; // only link-out schemes become hrefs (devin:// opens the session in Devin Desktop)
const MANUAL = ['teams', 'link', 'note', 'ghref'];
let focus = null, propsOpen = false, enter = false; // focus = slug of the workstream in full view
const setFocus = (slug) => { focus = slug; selWs = slug; enter = true; window.scrollTo(0, 0); render(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && view === 'ws' && focus && !tsel.size && !e.target.closest?.('input, select, textarea')) setFocus(null); });

function ws() {
  if (focus && !wsOf(focus)) focus = null;
  selWs = focus;
  const main = focus ? focusView(wsOf(focus)) : mindmap();
  // the breadcrumb spans the full width, so the Inbox panel starts level with the workstream title
  const crumb = focus ? crumbHtml(wsOf(focus)) : wsBar();
  return panelOpen ? `${crumb}<div class="wsx with-panel">${inboxPanel()}<div>${main}</div></div>` : crumb + main;
}
// Inbox panel beside the map (or a focused workstream): classify by dragging rows onto nodes
let panelOpen = store.get('plate.panel', true);
const togglePanel = () => { panelOpen = !panelOpen; store.set('plate.panel', panelOpen); render(); };

// ---------- Today mode: what moved today (events.jsonl), as lit nodes + a timeline ----------
let todayOn = store.get('plate.today', false);
const EVLABEL = { 'item.new': 'added', 'item.moved': 'moved in', 'item.gone': 'left', 'item.removed': 'removed', 'workstream.new': 'new workstream',
  'workstream.reparented': 'reparented', 'todo.new': 'new to-do', 'todo.done': 'to-do done', 'todo.reopened': 'to-do reopened' };
const evLabel = (e) => e.type === 'item.state' ? `${e.from || '?'} → ${e.to || '?'}` : EVLABEL[e.type] || e.type;
// per workstream: event count and the rank of its first event today (lighting order)
function todayHeat() {
  const by = new Map();
  for (const e of [...S.events].sort((a, b) => a.ts.localeCompare(b.ts))) {
    if (!e.workstream || !wsOf(e.workstream)) continue;
    if (!by.has(e.workstream)) by.set(e.workstream, { n: 0, rank: by.size });
    by.get(e.workstream).n++;
  }
  const max = Math.max(1, ...[...by.values()].map((v) => v.n));
  for (const v of by.values()) v.heat = 0.35 + (0.65 * v.n) / max;
  return by;
}
function timeline(L) {
  const evs = [...S.events].sort((a, b) => b.ts.localeCompare(a.ts));
  const row = (e) => {
    const w = wsOf(e.workstream), t = new Date(e.ts);
    return `<div class="ev" ${w ? `data-focus="${esc(w.slug)}" style="--b:${L.pos.get(w.slug)?.color}"` : ''} title="${esc(e.source || '')} · ${esc(e.type)}">
      <time>${t.getHours()}:${pad(t.getMinutes())}</time><span class="what"><i>${esc(evLabel(e))}</i> ${esc(e.title || e.ref || '')}</span>
      <span class="where">${w ? `▸ ${esc(w.name)}` : e.workstream ? esc(e.workstream) : 'Inbox'}</span></div>`;
  };
  return `<aside class="tl"><h3>Today <span>· ${evs.length} event${evs.length === 1 ? '' : 's'}</span></h3>${evs.map(row).join('') || '<p class="hint">Nothing moved yet today.</p>'}</aside>`;
}

// title + controls; drawn above the panel/map grid so the Inbox panel starts level with the canvas
const wsBar = () => `<div class="ws-bar"><div class="page-h"><h2>Workstreams</h2><p>Click a node to focus on it · drag a node onto another to re-parent, onto the center to make it a root · dashed = related · paste a link or note to add it to the Inbox</p></div>
      <button class="btn ${panelOpen ? 'on' : ''}" data-panel title="Inbox panel (i)">Inbox · ${S.items.filter(inInbox).length}</button>
      <button class="btn ${todayOn ? 'on' : ''}" id="todayBtn" title="Light up what moved today (t)">Today</button>
      <input id="newName" placeholder="New workstream…" size="18"><button class="btn" id="newRoot">+ Root</button>
</div>`;
function mindmap() {
  const L = layoutWs(), heat = todayOn ? todayHeat() : new Map(), inNeed = S.items.filter((i) => i.needsYou && !i.workstream).length;
  const nodes = S.workstreams.map((w) => {
    const p = L.pos.get(w.slug), st = wsStats(w.slug), h = heat.get(w.slug);
    return `<div class="wnode ${p.d === 0 ? 'root' : ''} ${st.need ? 'need' : ''} ${h ? 'lit' : ''} ${esc(w.state)}" draggable="true" data-slug="${esc(w.slug)}"
      style="left:${p.x}px;top:${p.y}px;--b:${p.color}${h ? `;--heat:${h.heat.toFixed(2)};--d:${Math.min(h.rank * 0.15, 3)}s` : ''}" title="${esc(w.name)} · ${st.n} items${st.need ? ` · ${st.need} needs you` : ''}${h ? ` · ${h.n} event${h.n > 1 ? 's' : ''} today` : ''}${w.state !== 'active' ? ` · ${esc(w.state)}` : ''}">
      <span class="wn">${esc(w.name)}</span>${st.need ? `<span class="wneed">${st.need}</span>` : st.n ? `<span class="wc">${st.n}</span>` : ''}</div>`;
  }).join('');
  return `<div class="ws-main ${todayOn ? 'today' : ''}">
    <div class="canvas-scroll"><div class="canvas ${todayOn ? 'today' : ''} ${todayAnim ? 'anim' : ''}" style="width:${L.w}px;height:${L.h}px"><svg width="${L.w}" height="${L.h}">${edgesSvg(L, heat)}</svg>
      <div class="hub ${inNeed ? 'need' : ''}" id="rootzone" style="left:${L.cx}px;top:${L.cy}px" title="Drop a workstream here to make it top-level${inNeed ? ` · ${inNeed} in the Inbox need you` : ''}">On my plate${inNeed ? `<span class="wneed">${inNeed}</span>` : ''}</div>${nodes || '<div class="empty">No workstreams yet. Create one above.</div>'}</div></div>
    ${todayOn ? timeline(L) : ''}</div>`;
}
let todayAnim = false;
const toggleToday = () => { todayOn = !todayOn; store.set('plate.today', todayOn); todayAnim = todayOn; render(); todayAnim = false; };
document.addEventListener('keydown', (e) => { if (e.key === 't' && view === 'ws' && !focus && !e.metaKey && !e.ctrlKey && !e.altKey && !e.target.closest?.('input, select, textarea')) toggleToday(); });

// action-first grouping of one workstream's items
function groupItems(items) {
  const g = { need: [], prog: [], soon: [], talk: [], done: [] };
  for (const i of items) {
    const review = i.kind === 'pr' && i.state === 'open' && /review/i.test(i.status || '');
    if (i.state === 'done' || i.state === 'gone') g.done.push(i);
    else if (i.needsYou || review) g.need.push(i);
    else if (MANUAL.includes(i.source) && i.source !== 'ghref') g.talk.push(i);
    else if (i.source === 'todoist') g.soon.push(i);
    else g.prog.push(i);
  }
  for (const k of Object.keys(g)) g[k].sort(byDue);
  return g;
}

// Meeting note: runs the vault's own QuickAdd choice (sources.md `meeting_quickadd`, `obsidian_vault`) through its URI.
// `meeting_values` fill named {{VALUE:x}} variables; QuickAdd still prompts for the unnamed ones (the title).
function meetingNote(w) {
  const m = S.meeting;
  if (!m) return toast('Set meeting_quickadd (QuickAdd choice name) and obsidian_vault in sources.md');
  const vars = { workstream: w.name, project: w.project || w.name, slug: w.slug, date: S.today };
  const fill = (t) => String(t).replace(/\{(\w+)\}/g, (all, k) => vars[k] ?? all);
  const q = [m.vault && `vault=${encodeURIComponent(m.vault)}`, `choice=${encodeURIComponent(m.choice)}`,
    ...Object.entries(m.values || {}).map(([k, v]) => `value-${encodeURIComponent(k)}=${encodeURIComponent(fill(v))}`)].filter(Boolean).join('&');
  location.href = `obsidian://quickadd?${q}`;
  toast(`Opening “${m.choice}” in Obsidian…`);
}
// workstream body: free text stays a paragraph; `- [ ]` / `- [x]` lines become a to-do list that writes back to the .md
const TODO_RE = /^\s*[-*] \[([ xX])\] (.*)$/;
function bodyHtml(w) {
  const lines = (w.body || '').split('\n'), text = lines.filter((l) => !TODO_RE.test(l)).join('\n').trim();
  const todos = lines.filter((l) => TODO_RE.test(l)).map((l) => { const m = l.match(TODO_RE); return { done: m[1] !== ' ', text: m[2].trim() }; });
  const open = todos.filter((t) => !t.done).length;
  return `${text ? `<p class="fbody">${esc(text)}</p>` : ''}
    <div class="todos"><div class="subrow"><span>To-do</span>${todos.length ? `<span class="chip dim">${open} open</span>` : ''}</div>
      ${todos.map((t, n) => `<label class="${t.done ? 'x' : ''}"><input type="checkbox" data-todo="${n}" ${t.done ? 'checked' : ''}>${esc(t.text)}</label>`).join('')}
      <div class="addtodo"><input id="todoNew" placeholder="Add a to-do… (Enter)"></div></div>`;
}

function crumbHtml(w) {
  const trail = []; // ancestors, root first
  for (let p = wsOf(w.parent), n = 0; p && n < 20; p = wsOf(p.parent), n++) trail.unshift(p);
  return `<nav class="crumb ${panelOpen ? '' : 'solo'}"><button data-focus="">Workstreams</button>${trail.map((p) => ` / <button data-focus="${esc(p.slug)}">${esc(p.name)}</button>`).join('')} / <b>${esc(w.name)}</b>
    <span class="esc">Esc to go back</span></nav>`;
}
function focusView(w) {
  const items = S.items.filter((i) => i.workstream === w.slug), g = groupItems(items);
  const open = items.filter((i) => i.state !== 'done').length;
  const opt = (v, t, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(t)}</option>`;
  const others = S.workstreams.filter((x) => x.slug !== w.slug);
  const kids = S.workstreams.filter((x) => x.parent === w.slug);
  const rel = new Set([...w.related, ...S.workstreams.filter((x) => x.related.includes(w.slug)).map((x) => x.slug)]);
  const mv = (i) => `<span class="cact"><select data-mv="${esc(i.id)}" title="Move to…"><option value="">Move to…</option><option value="__inbox">Inbox</option>${S.workstreams.filter((x) => x.slug !== w.slug).map((x) => `<option value="${esc(x.slug)}">${esc(x.name)}</option>`).join('')}</select>${MANUAL.includes(i.source) ? `<button data-rm="${esc(i.id)}" title="Remove">✕</button>` : ''}</span>`;
  const section = (cls, title, hint, list) => list.length ? `<section class="fsec ${cls}"><h3>${title}<span>${list.length}</span></h3>${hint ? `<p>${hint}</p>` : ''}<div class="igrid">${list.map((i) => card(i, true, mv(i))).join('')}</div></section>` : '';
  const chips = (title, list) => list.length ? `<div class="subrow"><span>${title}</span>${list.map((x) => { const st = wsStats(x.slug); return `<button class="sub-ws ${st.need ? 'need' : ''}" data-focus="${esc(x.slug)}"><b>${esc(x.name)}</b><span>${st.n} items${st.need ? ` · ${st.need} needs you` : ''}</span></button>`; }).join('')}</div>` : '';
  const empty = !items.length ? '<div class="empty">Nothing in this workstream yet. Paste a link or note, or drag items here from the Board.</div>' : '';
  return `<div class="focus ${enter ? 'enter' : ''}">
    <header class="fhead"><h1>${esc(w.name)}</h1>
      <div class="wrow"><button class="btn" id="meetBtn" title="New meeting note for this workstream (QuickAdd in Obsidian)">+ Meeting note</button><span class="chip">${open} open</span>${g.need.length ? `<span class="chip need">${g.need.length} need you</span>` : ''}<span class="chip dim">${esc(w.state)}</span></div>
      ${bodyHtml(w)}</header>
    ${chips('Inside', kids)}${chips('Related', [...rel].map(wsOf).filter(Boolean))}
    ${section('need', 'Needs you / next', 'Waiting sessions, overdue and due-today tasks, PRs in review: this is what moves it forward.', g.need)}
    ${section('', 'In progress', 'Running sessions and open issues and PRs.', g.prog)}
    ${section('', 'Coming up', 'Tasks with a later date.', g.soon)}
    ${section('', 'Conversations & notes', '', g.talk)}
    ${g.done.length ? `<details class="fdone"><summary>Recently done · ${g.done.length}</summary><div class="igrid">${g.done.map((i) => card(i, true, mv(i))).join('')}</div></details>` : ''}
    ${empty}
    <details class="props" ${propsOpen ? 'open' : ''}><summary>Edit workstream</summary><div class="f">
      <label>Name</label><input id="fName" value="${esc(w.name)}">
      <label>State</label><select id="fState">${['active', 'paused', 'done'].map((s) => opt(s, s, w.state)).join('')}</select>
      <label>Parent</label><select id="fParent">${opt('', '— root —', w.parent || '')}${others.map((x) => opt(x.slug, x.name, w.parent || '')).join('')}</select>
      <label>Related</label><div class="rels">${[...rel].map((r) => `<span class="chip x" data-unrel="${esc(r)}" title="Remove link">${esc(wsOf(r)?.name || r)} ✕</span>`).join('')}
        <select id="fRelAdd"><option value="">+ link…</option>${others.filter((x) => !rel.has(x.slug)).map((x) => opt(x.slug, x.name, '')).join('')}</select></div>
      <label>GitHub</label><input id="fGh" value="${esc(w.github.join(', '))}" placeholder="repo:owner/name, issue:owner/repo#12">
      <span></span><span class="hint" style="margin:0">Routing rules: new GitHub items from a <code>repo:</code> (or under an <code>issue:</code> epic) land here instead of the Inbox. Items already on the plate stay put.</span>
      <label>Sub-workstream</label><div class="rels"><input id="newName" placeholder="New child…"><button class="btn" id="newChild">Add</button></div>
      <label>Teams</label><div class="rels"><input id="tLabel" placeholder="Label"><input id="tUrl" placeholder="https://… or msteams://…"><button class="btn" id="tAdd">Add</button></div>
    </div></details></div>`;
}

function wireWs() {
  const save = async (slug, patch) => { await post('/api/ws/update', { slug, ...patch }); load(); };
  const create = async (parent) => {
    const name = $('#newName').value.trim(); if (!name) return $('#newName').focus();
    const r = await post('/api/ws/create', { name, parent });
    if (r) { if (!parent) enter = true; await load(); }
  };
  $('#newName').onkeydown = (e) => { if (e.key === 'Enter') create(focus || ''); };
  enter = false;
  if (!focus) {
    $('#newRoot').onclick = () => create('');
    $('#todayBtn').onclick = toggleToday;
    document.querySelector('[data-panel]').onclick = togglePanel;
    document.querySelectorAll('.tl [data-focus]').forEach((r) => (r.onclick = () => setFocus(r.dataset.focus)));
    // nodes: click = focus; drag = re-parent; also drop targets for item cards
    document.querySelectorAll('.wnode').forEach((n) => {
      n.onclick = () => setFocus(n.dataset.slug);
      n.ondragstart = (e) => { e.dataTransfer.setData('application/x-plate-ws', n.dataset.slug); e.dataTransfer.setData('text/plain', ''); n.classList.add('dragging'); };
      n.ondragend = () => n.classList.remove('dragging');
      n.ondragover = (e) => { e.preventDefault(); n.classList.add('over'); };
      n.ondragleave = () => n.classList.remove('over');
      n.ondrop = async (e) => {
        e.preventDefault(); e.stopPropagation(); n.classList.remove('over');
        const dragged = e.dataTransfer.getData('application/x-plate-ws');
        if (dragged) { if (dragged !== n.dataset.slug) { await post('/api/ws/update', { slug: dragged, parent: n.dataset.slug }); load(); } return; }
        const ids = draggedIds(e);
        if (ids.length) moveSel(n.dataset.slug, null, ids);
      };
    });
    const rz = $('#rootzone');
    rz.ondragover = (e) => { e.preventDefault(); rz.classList.add('over'); };
    rz.ondragleave = () => rz.classList.remove('over');
    rz.ondrop = async (e) => { e.preventDefault(); const s = e.dataTransfer.getData('application/x-plate-ws'); if (s) { await post('/api/ws/update', { slug: s, parent: '' }); load(); } };
    return;
  }
  const slug = focus, w = wsOf(slug);
  document.querySelectorAll('[data-focus]').forEach((b) => (b.onclick = () => setFocus(b.dataset.focus || null)));
  // in focus: panel rows drop on the header (into this workstream) or on a child chip; this workstream's cards drag to the chips
  const drop = (el, target) => {
    el.ondragover = (e) => { e.preventDefault(); el.classList.add('over'); };
    el.ondragleave = () => el.classList.remove('over');

// ---------- fit the Workstreams view to the window: the map scales down (zoom) instead of scrolling, panes end above the dock ----------
const MIN_ZOOM = 0.55;
function fitView() {
  if (view !== 'ws') return;
  const bottom = parseFloat(getComputedStyle($('main')).paddingBottom) || 0;
  const room = (el) => Math.max(240, innerHeight - (el.getBoundingClientRect().top + scrollY) - bottom);
  const cs = document.querySelector('.canvas-scroll'), cv = cs?.querySelector('.canvas');
  if (cv) {

    const pad = 2 * 16 + 2, w = parseFloat(cv.style.width), h = parseFloat(cv.style.height);
    cv.style.zoom = Math.max(MIN_ZOOM, Math.min(1, (cs.clientWidth - pad) / w, (cs.clientHeight - pad) / h));
  }
  for (const el of document.querySelectorAll('.ipanel, .tl')) el.style.maxHeight = `${room(el)}px`;
  const ip = document.querySelector('.ipanel'); if (ip && cs) ip.style.height = cs.style.height; // same box as the map beside it
}
addEventListener('resize', () => requestAnimationFrame(fitView));

  if (view !== 'ws' || !panelOpen || e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.('input, select, textarea')) return;
  if (e.key === 'a') { triageList().forEach((i) => tsel.add(i.id)); renderPanel(); }
  else if (e.key === 'm' && tsel.size) { e.preventDefault(); $('#tMove')?.focus(); }
  else if (e.key === 'Escape' && tsel.size) { tsel.clear(); renderPanel(); }
  else if (e.key === 'd' && tsel.size) dismiss([...tsel], tscope !== 'dismissed');
});

// ---------- smart paste: Cmd+V outside a form field adds an item ----------
function classifyPaste(raw) {
  const text = raw.trim(), oneToken = !/\s/.test(text);
  if (oneToken && (/teams\.(microsoft\.com|cloud\.microsoft)\/l\//i.test(text) || /^msteams:/i.test(text))) return { source: 'teams', title: 'Teams conversation', url: text };
  if (oneToken && /^https:\/\/github\.com\/[\w.-]+\/[\w.-]+\/(issues|pull)\/\d+/i.test(text)) return { source: 'ghref', url: text };
  if (oneToken && /^https?:\/\//i.test(text)) {
    let title = text;
    try { const u = new URL(text); const last = decodeURIComponent(u.pathname.split('/').filter(Boolean).pop() || ''); title = u.hostname.replace(/^www\./, '') + (last ? ` › ${last}` : ''); } catch {}
    return { source: 'link', title: title.slice(0, 120), url: text };
  }
  const flat = text.replace(/\s+/g, ' ');
  return { source: 'note', title: flat.slice(0, 200), ...(flat.length > 200 || text.includes('\n') ? { note: text } : {}) };
}
document.addEventListener('paste', async (e) => {
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  const raw = e.clipboardData?.getData('text/plain') || '';
  if (!raw.trim()) return;
  e.preventDefault();
  const target = view === 'ws' ? selWs : null; // workstream open in the panel, else Inbox
  const item = { ...classifyPaste(raw), workstream: target };
  if (item.source === 'ghref') toast('Looking up the GitHub item…');
  const r = await post(item.source === 'ghref' ? '/api/items/add-github' : '/api/items/add', item);
  if (!r) return;
  await load();
  const where = (slug) => (slug ? wsOf(slug)?.name : 'Inbox');
  if (r.existing) {
    // already on the plate: offer to bring it into the workstream that's open
    if (!target || r.workstream === target) return toast(`Already on your plate, in ${where(r.workstream)}`);
    return toast(`Already in ${where(r.workstream)}`, async () => {
      const m = await post('/api/move', { id: r.id, workstream: target });
      if (m) { await load(); toast(`Moved to ${where(target)}`, async () => { await post('/api/move', { id: r.id, workstream: r.workstream }); load(); }); }
    }, `Move to ${where(target)}`);
  }
  const it = S.items.find((x) => x.id === r.id);
  const label = item.source === 'ghref' ? `${it?.repo}#${it?.number}${r.prs ? ` + ${r.prs} PR${r.prs > 1 ? 's' : ''}` : ''}` : { teams: 'Teams link', link: 'link', note: 'note' }[item.source];
  toast(`Added ${label} to ${where(r.workstream ?? target)}`, async () => { await post('/api/items/remove', { id: r.id }); load(); });
});

load().then(() => {
  const h = new URLSearchParams(location.hash.slice(1)).get('ws');
  if (h && wsOf(h.split(',').pop())) setFocus(h.split(',').pop());
});
</script>

<!doctype html>
<meta charset="utf-8">
<title>Plate</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    color-scheme: dark;
    /* surfaces */
    --bg: #07100f; --bg-glow-1: #123a33; --bg-glow-2: #2a2414;
    --surface: rgb(255 255 255 / .035); --surface-2: rgb(255 255 255 / .06); --surface-3: rgb(255 255 255 / .09);
    --line: rgb(255 255 255 / .08); --line-2: rgb(255 255 255 / .14);
    /* text */
    --text: #eef3f0; --text-2: #aab8b2; --text-3: #72837c;
    /* semantic: accent is reserved for "needs you" */
    --accent: #ffa56e; --accent-soft: rgb(255 165 110 / .12); --accent-line: rgb(255 165 110 / .38); --accent-ink: #2a1708;
    --late: #f0707f; --today: #e8c35a; --live: #5fd3a2;
    --pr: #56d364; --pr-merged: #a371f7; /* GitHub's own semantics: open PR green, merged purple, closed red */ --issue: #7fb5f0; --todo: #8fd0c4; --sess: #e7e2d4;
    /* type scale */
    --fs-xs: 11px; --fs-sm: 12.5px; --fs-md: 14px; --fs-lg: 17px; --fs-xl: 24px; --fs-2xl: 34px;
    --font: ui-sans-serif, -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    /* space + shape */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --r-sm: 8px; --r-md: 14px; --r-lg: 20px;
    --dock-h: 96px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    font: var(--fs-md)/1.45 var(--font); color: var(--text); margin: 0; min-height: 100vh;
    background:
      radial-gradient(1100px 520px at 18% -8%, var(--bg-glow-1), transparent 70%),
      radial-gradient(900px 420px at 100% 108%, var(--bg-glow-2), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-line); }
  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 9px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.sm { width: 14px; height: 14px; }

  /* ---------- top bar ---------- */
  header.top { display: flex; align-items: center; gap: var(--s5); padding: var(--s5) var(--s6) var(--s3); }
  .brand { font-size: var(--fs-md); font-weight: 600; letter-spacing: .02em; }
  .brand span { color: var(--text-3); font-weight: 400; }
  .clock { margin-left: auto; font-size: var(--fs-2xl); font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .date { color: var(--text-2); font-size: var(--fs-sm); line-height: 1.3; }
  .date b { display: block; color: var(--text); font-weight: 600; font-size: var(--fs-md); }
  .stats { display: flex; gap: var(--s2); padding: var(--s2); border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); backdrop-filter: blur(14px); }
  .stat { display: flex; flex-direction: column; padding: 6px var(--s4); border-radius: var(--r-md); min-width: 84px; }
  .stat b { font-size: var(--fs-xl); font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: var(--fs-xs); color: var(--text-3); letter-spacing: .06em; text-transform: uppercase; }
  .stat.need { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
  .stat.need b, .stat.need span { color: var(--accent); }
  .stat.need.zero { background: none; box-shadow: none; } .stat.need.zero b, .stat.need.zero span { color: var(--text-3); }
  .stat.link { cursor: pointer; }

  main { padding: var(--s3) var(--s6) calc(var(--dock-h) + var(--s6)); }

  /* ---------- dock ---------- */
  nav.dock {
    position: fixed; left: 50%; bottom: var(--s5); transform: translateX(-50%); z-index: 10;
    display: flex; gap: var(--s2); padding: var(--s2);
    border: 1px solid var(--line-2); border-radius: var(--r-lg);
    background: rgb(10 20 18 / .72); backdrop-filter: blur(20px) saturate(1.3);
    box-shadow: 0 18px 50px rgb(0 0 0 / .5);
  }
  nav.dock button {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px;
    width: 92px; padding: 10px 0 8px; border: 1px solid transparent; border-radius: var(--r-md);
    background: none; color: var(--text-3); font: 500 var(--fs-xs)/1 var(--font); letter-spacing: .04em; cursor: pointer;
    transition: color .15s, background .15s;
  }
  nav.dock button:hover { color: var(--text); background: var(--surface); }
  nav.dock button.on { color: var(--text); background: var(--surface-2); border-color: var(--line-2); }
  nav.dock button.on::after { content: ""; position: absolute; left: 24px; right: 24px; bottom: -9px; height: 2px; border-radius: 2px; background: var(--text); opacity: .85; }
  nav.dock button .pip { position: absolute; top: 5px; right: 20px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 10.5px; font-weight: 700; line-height: 18px; text-align: center; }
  nav.dock .sep { width: 1px; background: var(--line); margin: 8px 2px; }


  /* ---------- cards ---------- */
  .card {
    --k: var(--text-2);
    position: relative; margin-bottom: var(--s2); padding: var(--s3) var(--s3) var(--s3) var(--s4);
    border: 1px solid var(--line); border-radius: var(--r-md); background: rgb(14 24 22 / .72);
    cursor: grab; transition: transform .15s, border-color .15s, background .15s;
  }
  .card:hover { border-color: var(--line-2); background: rgb(20 32 29 / .85); transform: translateY(-1px); }
  .card::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--k); opacity: .75; }
  .card.k-todoist { --k: var(--todo); } .card.k-pr { --k: var(--pr); } .card.k-issue { --k: var(--issue); } .card.k-session { --k: var(--sess); } .card.k-teams { --k: #9db4ff; } .card.k-link { --k: #7fd0e0; } .card.k-note { --k: #d9c79a; } .card.k-draft { --k: var(--text-3); }
  .gh-merged { --k: var(--pr-merged) !important; } .gh-closed { --k: var(--late) !important; }
  .card.dragging { opacity: .35; transform: scale(.98); }
  .card.done { opacity: .5; } .card.done .ttl { text-decoration: line-through; text-decoration-color: var(--text-3); }
  .card .kind { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--k); }
  .card .kind .ref { margin-left: auto; font: 500 var(--fs-xs) var(--mono); letter-spacing: 0; text-transform: none; color: var(--text-3); }
  .card .ttl { color: var(--text); text-decoration: none; font-size: var(--fs-md); font-weight: 500; line-height: 1.38; display: block; overflow-wrap: anywhere; }
  .card .ttl:hover { text-decoration: underline; text-decoration-color: var(--text-3); text-underline-offset: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s3); align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); font-size: var(--fs-xs); line-height: 1.6; white-space: nowrap; }
  .chip.dim { color: var(--text-3); background: none; box-shadow: inset 0 0 0 1px var(--line); }
  .chip.late { color: var(--late); background: rgb(240 112 127 / .12); }
  .chip.today { color: var(--today); background: rgb(232 195 90 / .12); }
  .chip.soon { color: var(--text-2); }
  .chip.ws { color: var(--text-2); margin-left: auto; }

  /* session states */
  .state { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st-waiting { color: var(--accent); } .st-running { color: var(--live); } .st-done { color: var(--text-3); } .st-idle { color: var(--text-2); }
  .st-running::before { animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgb(95 211 162 / .6); } 100% { box-shadow: 0 0 0 8px rgb(95 211 162 / 0); } }
  @media (prefers-reduced-motion: reduce) { .st-running::before { animation: none; } }
  .card.need::before { background: var(--accent); opacity: 1; }
  .card.need.k-session { border-color: var(--accent-line); background: linear-gradient(135deg, rgb(255 165 110 / .13), rgb(14 24 22 / .8) 60%); box-shadow: 0 0 28px -8px rgb(255 165 110 / .4); }
  .card.need .state { padding: 2px 9px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); }
  .card.need .state::before { background: var(--accent-ink); }

  /* ---------- needs you ---------- */
  .page-h { margin: var(--s3) 0 var(--s5); }
  .page-h h2 { margin: 0; font-size: var(--fs-xl); font-weight: 600; letter-spacing: -.02em; }
  .page-h p { margin: 4px 0 0; color: var(--text-3); font-size: var(--fs-sm); }
  .needs { max-width: 720px; }
  .needs .card { padding: var(--s4) var(--s4) var(--s4) var(--s5); }
  .needs .card .ttl { font-size: var(--fs-lg); }
  .empty { color: var(--text-3); padding: var(--s6); border: 1px dashed var(--line-2); border-radius: var(--r-lg); max-width: 720px; text-align: center; }

  /* ---------- workstreams mindmap ---------- */
  :root { --pw: min(720px, calc(100vw - 24px)); }
  .ws-main { transition: margin-right .28s ease; }
  .ws-bar { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-bottom: var(--s4); }
  .ws-bar .page-h { margin: 0 auto 0 0; }
  input, select, button.btn { font: var(--fs-sm) var(--font); color: var(--text); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 6px 10px; }
  input:focus, select:focus { outline: none; border-color: var(--text-2); }
  select option { background: #10201d; }
  button.btn { cursor: pointer; } button.btn:hover { background: var(--surface-3); }
  button.btn.ghost { background: none; color: var(--text-2); }
  .rootzone { padding: 6px 14px; border: 1px dashed var(--line-2); border-radius: 99px; color: var(--text-3); font-size: var(--fs-xs); letter-spacing: .06em; text-transform: uppercase; }
  .rootzone.over { border-color: var(--text); color: var(--text); background: var(--surface-2); }
  .canvas-scroll { position: relative; overflow: hidden; cursor: grab; touch-action: none; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: var(--s4); box-sizing: border-box; }
  .canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .canvas-scroll.panning { cursor: grabbing; } .canvas-scroll.panning .wnode, .canvas-scroll.panning .tnode { pointer-events: none; }
  .zoomctl { position: absolute; right: 12px; bottom: 12px; z-index: 3; display: flex; gap: 4px; cursor: default; }
  .zoomctl button { min-width: 30px; height: 28px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 8px; background: rgb(14 24 22 / .85); color: var(--text-2); font: 600 var(--fs-sm) var(--font); cursor: pointer; backdrop-filter: blur(6px); }
  .zoomctl button:hover { color: var(--text); background: var(--surface-3); }
  .wtog { flex: none; padding: 0 6px; border: 1px solid var(--line-2); border-radius: 9px; background: none; color: var(--text-3); font: 600 10.5px/16px var(--font); cursor: pointer; }
  .wtog:hover, .wtog.on { color: var(--text); border-color: var(--text-3); }
  .tnode { position: absolute; transform: translate(-50%, -50%); max-width: 150px; padding: 4px 9px; border: 1px solid color-mix(in srgb, var(--b) 55%, transparent); border-radius: 99px; background: rgb(14 24 22 / .95); color: var(--text-2); font-size: var(--fs-xs); line-height: 1.3; text-decoration: none; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tnode:hover { color: var(--text); border-color: var(--b); } .tnode.need { border-color: var(--accent); color: var(--accent); }
  .tnode.more { color: var(--text-3); border-style: dashed; }
  .wnode.stale:not(.need) { opacity: .6; } .wst { flex: none; font-size: 10.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .canvas.nbhd .wnode:not(.nb) { opacity: .22; } .canvas.nbhd .edge:not(.nb) { opacity: .1; } .canvas.nbhd .tnode { opacity: .3; }
  .canvas.nbhd .wnode, .canvas.nbhd .edge { transition: opacity .12s; }
  .pal { position: fixed; inset: 0; z-index: 30; background: rgb(3 8 7 / .55); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: flex-start; padding-top: 14vh; }
  .pal-box { width: min(560px, 92vw); border: 1px solid var(--line-2); border-radius: var(--r-lg); background: rgb(12 22 20 / .97); box-shadow: 0 24px 60px -20px #000; overflow: hidden; }
  .pal-box input { width: 100%; box-sizing: border-box; padding: 14px 18px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--text); font: 500 var(--fs-lg) var(--font); outline: none; }
  .pal-list { max-height: 50vh; overflow-y: auto; padding: 6px; }
  .pal-row { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border-radius: 9px; cursor: pointer; font-size: var(--fs-md); }
  .pal-row.on { background: var(--surface-3); } .pal-row .k { flex: none; width: 54px; font: 500 var(--fs-xs) var(--mono); color: var(--text-3); text-transform: uppercase; }
  .pal-row .t { flex: 1; min-width: 0; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .pal-row .s { flex: none; max-width: 40%; color: var(--text-3); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pal-empty { padding: 18px; color: var(--text-3); text-align: center; }
  .daynav .seg { display: inline-flex; gap: 2px; margin-left: auto; } .daynav .seg .btn.on { background: var(--surface-3); color: var(--text); }
  .wnode.fresh { border-color: var(--live); box-shadow: 0 0 0 3px rgb(95 211 162 / .25), 0 0 26px -4px var(--live); z-index: 2; }
  .wnode.fresh::before { content: "new"; position: absolute; top: -9px; left: 50%; transform: translateX(-50%); padding: 0 6px; border-radius: 8px; background: var(--live); color: #04140d; font: 700 9.5px/14px var(--font); letter-spacing: .06em; text-transform: uppercase; }
  .wnode.fresh::after { content: ""; position: absolute; inset: -2px; border-radius: inherit; border: 2px solid var(--live); pointer-events: none; animation: needpulse 1.6s ease-out infinite; }
  .top3 { display: flex; gap: var(--s2); align-items: stretch; margin: 0 0 var(--s3); }
  .top3 .t3lbl { flex: none; align-self: center; padding-right: var(--s2); font-size: var(--fs-xs); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); } .t3lbl b { color: var(--text-2); font-variant-numeric: tabular-nums; }
  .t3 { position: relative; flex: 1 1 0; min-width: 0; display: flex; gap: 10px; align-items: center; padding: 8px 12px; border: 1px solid var(--line-2); border-radius: var(--r-md); background: var(--surface-2); cursor: pointer; }
  .t3:hover { background: var(--surface-3); } .t3 .n { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--text); color: var(--bg); font: 700 11px/20px var(--font); text-align: center; }
  .t3 .tx { min-width: 0; } .t3 .tt { display: block; font-size: var(--fs-sm); font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t3 .ts { display: block; font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t3.done .tt { text-decoration: line-through; color: var(--text-3); } .t3.done .n { background: var(--live); }
  .t3 .x { position: absolute; right: 6px; top: 4px; border: 0; background: none; color: var(--text-3); cursor: pointer; visibility: hidden; } .t3:hover .x { visibility: visible; } .t3 .x:hover { color: var(--text); } .t3 .x[data-t3done] { right: 26px; } .t3.done .x[data-t3done] { visibility: visible; color: var(--live); }
  .t3.free { border-style: dashed; background: none; color: var(--text-3); font-size: var(--fs-sm); cursor: default; } .t3.free .n { background: none; border: 1px dashed var(--live); color: var(--live); } .t3.free:hover { background: none; }
  .t3.ghost { border-style: dashed; border-color: var(--line-2); background: none; opacity: .75; } .t3.ghost .n { background: none; border: 1px dashed var(--text-3); color: var(--text-3); }
  .t3.ghost .tt { font-weight: 500; color: var(--text-2); font-style: italic; } .t3.ghost:hover { opacity: 1; border-color: var(--live); } .t3.ghost .plus { flex: none; margin-left: auto; color: var(--live); font-size: var(--fs-xs); white-space: nowrap; }
  .t3lbl .carry { margin-left: 6px; padding: 1px 8px; border: 1px solid var(--line-2); border-radius: 99px; background: none; color: var(--live); font: inherit; letter-spacing: 0; text-transform: none; cursor: pointer; } .t3lbl .carry:hover { background: var(--surface-2); }
  .pinstar { color: var(--today); font-size: 11px; margin-left: 4px; } .wnode .pinstar { position: absolute; top: -7px; right: -5px; font-size: 13px; text-shadow: 0 0 6px #000; }
  .cmenu { position: fixed; z-index: 40; min-width: 210px; max-width: 300px; padding: 5px; border: 1px solid var(--line-2); border-radius: 12px; background: rgb(12 22 20 / .98); box-shadow: 0 16px 40px -14px #000; }
  .cmenu .h { padding: 5px 10px 6px; font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cmenu button { display: block; width: 100%; padding: 7px 10px; border: 0; border-radius: 8px; background: none; color: var(--text); font: inherit; font-size: var(--fs-sm); text-align: left; cursor: pointer; } .cmenu button:hover:not(:disabled) { background: var(--surface-3); } .cmenu button:disabled { color: var(--text-3); cursor: default; }
  .edge.tk { stroke: var(--b); stroke-width: 1.1; opacity: .5; }
  .canvas svg { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .edge { fill: none; stroke: var(--line-2); stroke-width: 1.6; }
  .edge.rel { stroke: var(--text-3); stroke-width: 1.3; stroke-dasharray: 4 5; opacity: .85; }
  .edge.hl { stroke: var(--text-2); opacity: 1; }
  .wnode {
    position: absolute; padding: 10px 14px; border: 1px solid var(--line-2); border-radius: var(--r-md);
    background: rgb(14 24 22 / .92); cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 6px;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .wnode:hover { background: rgb(22 36 33 / .95); }
  .wnode.sel { border-color: var(--text); box-shadow: 0 0 0 3px rgb(255 255 255 / .08); }
  .wnode.over { border-color: var(--live); box-shadow: 0 0 0 3px rgb(95 211 162 / .2); }
  .wnode.need { border-color: var(--accent-line); box-shadow: 0 0 22px -8px rgb(255 165 110 / .5); }
  .wnode.need.sel { border-color: var(--accent); }
  .wnode.paused { opacity: .7; } .wnode.done { opacity: .45; }
  .wnode.done .wn { text-decoration: line-through; text-decoration-color: var(--text-3); }
  .wn { font-weight: 600; font-size: var(--fs-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wrow { display: flex; gap: 6px; align-items: center; }
  .wnode.dragging { opacity: .35; }
  .addteams { display: grid; gap: 6px; margin-top: var(--s3); }
  .addteams summary { cursor: pointer; color: var(--text-3); font-size: var(--fs-xs); letter-spacing: .1em; text-transform: uppercase; }
  .hint { color: var(--text-3); font-size: var(--fs-sm); margin: var(--s3) 0 0; }
  #toasts { position: fixed; right: var(--s5); bottom: var(--s5); z-index: 40; display: flex; flex-direction: column; gap: var(--s2); align-items: flex-end; pointer-events: none; }
  .toast { pointer-events: auto; display: flex; gap: 14px; align-items: center; max-width: min(420px, 90vw); padding: 10px 16px; border-radius: var(--r-md); background: rgb(14 24 22 / .96); color: var(--text); border: 1px solid var(--line-2); box-shadow: 0 10px 40px rgb(0 0 0 / .5); font-size: var(--fs-sm); animation: toastin .2s ease-out; }
  .toast.err { background: var(--late); color: #2a0a10; border-color: transparent; font-weight: 600; }
  @keyframes toastin { from { opacity: 0; transform: translateY(8px); } }


  /* ---------- workstream focus ---------- */
  .chip.need { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-line); font-weight: 600; }
  .focus { max-width: 1120px; margin: 0 auto; padding-bottom: var(--s5); }
  .focus.enter { animation: focusin .32s ease both; }
  @keyframes focusin { from { opacity: 0; transform: scale(.985) translateY(10px); } }
  @media (prefers-reduced-motion: reduce) { .focus.enter { animation: none; } }
  .crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: var(--s2) 0 var(--s5); color: var(--text-3); font-size: var(--fs-sm); }
  .crumb button { background: none; border: 0; color: var(--text-2); font: inherit; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
  .crumb button:hover { background: var(--surface-2); color: var(--text); } .crumb b { color: var(--text); font-weight: 600; }
  .crumb.solo { max-width: 1120px; margin-left: auto; margin-right: auto; }

<script>
let S, view = 'ws', selWs = null, panelScroll = 0;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let lastState = '';
async function load() { const txt = await (await fetch('/api/state')).text(); lastState = txt; S = JSON.parse(txt); render(); }
// background refresh: collectors run inside the server; re-render only when data changed and you're not mid-edit or mid-drag
async function refresh() {
  if (document.hidden) return;

  if (txt === lastState) return;
  const busy = document.activeElement?.closest?.('input, textarea, select') || document.querySelector('.dragging');

setInterval(refresh, 20000);
document.addEventListener('visibilitychange', refresh);
function syncBadge() {

  const su = S.setup ? `<button class="syncbtn bad" id="setupbtn" title="CHANGELOG.md has entries this machine hasn't applied (${S.setup.seen ? `last applied: ${S.setup.seen}` : 'no .plate-changelog-seen yet'}). Click to open ${S.setupAgent === 'devin' ? 'a Devin' : 'a Claude Code'} session that applies them (setup_agent in Settings).">Setup pending · changelog #${S.setup.seen + 1 === S.setup.latest ? S.setup.latest : `${S.setup.seen + 1}–${S.setup.latest}`}</button> ` : '';

  if ($('#setupbtn')) $('#setupbtn').onclick = startSetup;
  $('#sync button:not(#setupbtn)').onclick = async () => { $('#sync button:not(#setupbtn)').textContent = 'Syncing…'; await fetch('/api/collect', { method: 'POST' }); setTimeout(refresh, 4000); setTimeout(refresh, 15000); };
}
// "Setup pending": the server opens the agent's session (Claude Code: a claude:// link we open here; Devin: a headless run whose
// session we open once it exists)
async function startSetup() {
  const r = await post('/api/setup/apply', {}); if (!r) return;
  if (r.agent === 'claude') { toast(`Claude Code: changelog ${r.range}`, () => window.open(r.url), 'Open again'); return void window.open(r.url); }

    await new Promise((ok) => setTimeout(ok, 1500)); await load();
    const run = S.runs?.setup, it = run?.session && S.items.find((x) => x.id === run.session);
    if (it && SAFE_URL.test(it.url || '')) return void toast('Devin session ready', () => window.open(it.url), 'Open');
    if (run?.state === 'failed') return toastErr(`Devin setup failed: ${run.msg}`);
  }

}
const VNAME = { ws: 'Workstreams', needs: 'Needs you' };
const pad = (n) => String(n).padStart(2, '0');
// per-browser UI prefs (Today mode, Inbox panel)
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

  $('#date').innerHTML = `<b>${d.toLocaleDateString('en-US', { weekday: 'long' })}</b>${d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' })}`;
}
tick(); setInterval(tick, 20000);
// the tab title carries the Needs-you count

let notes = store.get('plate.notes', []), noteSeen = null;
function collectNotes() {
  const found = new Map(), live = (i) => i.state !== 'done' && i.state !== 'gone';

    if (i.reviewMe) found.set(`rev:${i.id}`, { text: `Review requested: ${nameOf(i)}`, item: i.id });
    if (newAct(i)) found.set(`act:${i.id}:${i.activity.at}`, { text: `@${i.activity.by} ${i.activity.what || 'commented'} on ${nameOf(i)}`, item: i.id });
  }

    const url = u.replace(/^close:/, ''), it = S.items.find((x) => (x.url || '').replace(/[#?].*$/, '') === url);

// 1–2 switch views (dock order); `/` opens the Inbox panel's search, `i` toggles the panel
const VIEWS = [...document.querySelectorAll('nav.dock button')].map((b, n) => { b.title = `${VNAME[b.dataset.v]} (${n + 1})`; return b.dataset.v; });
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.('input, select, textarea, [contenteditable]')) return;

});

// r then d / g / a: sync Devin / GitHub (board, repos, my tickets, review requests) / everything right now
let rArm = 0;
const SYNCS = { d: [['devin'], 'Devin'], g: [['github', 'mine', 'reviews'], 'GitHub'], a: [null, 'everything'] };
document.addEventListener('keydown', async (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.('input, select, textarea, [contenteditable]')) return;

    setTimeout(refresh, 2500); setTimeout(refresh, 8000);

const ic = (d) => `<svg class="i sm" viewBox="0 0 24 24">${d}</svg>`;
const GLYPH = {
  todoist: ic('<circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/>'),
  issue: ic('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.5"/>'),
  pr: ic('<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V10a3 3 0 0 0-3-3h-3m2.5-2.5L12 7l2.5 2.5"/>'),
  draft: ic('<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M6 8.5v7" stroke-dasharray="2 2.5"/>'),
  teams: ic('<path d="M21 12a8 8 0 0 1-11.7 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/><path d="M9 11h6M9 14h3.5"/>'),
  link: ic('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'),
  note: ic('<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/>'),
  session: ic('<rect x="3" y="4" width="18" height="16" rx="3"/><path d="m8 10 3 2-3 2M13 14.5h3.5"/>'),
};
const REPEAT = ic('<path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/>');
const dueTag = (i) => {
  if (!i.due) return '';
  const cls = i.due < S.today ? 'late' : i.due === S.today ? 'today' : 'soon';

};
// merged/closed PRs take GitHub's colors instead of the open-PR green
const ghState = (i) => { const st = String(i.ghState || i.status || '').toLowerCase(); return i.kind === 'pr' && (st === 'merged' || st === 'closed') ? `gh-${st}` : ''; };
const KINDLABEL = { todoist: 'Todoist', pr: 'PR', issue: 'Issue', draft: 'Draft PR', session: 'Session', teams: 'Teams', link: 'Link', note: 'Note' };

  const label = i.source === 'tasknotes' ? 'TaskNote' : { todoist: 'Todoist', pr: 'PR', issue: 'Issue', draft: 'Draft PR', session: 'Session', teams: 'Teams', link: 'Link', note: 'Note' }[k] || esc(k);

  <a class="ttl" ${SAFE_URL.test(i.url || '') ? `href="${esc(i.url)}"` : ''} ${/^https?:/i.test(i.url || '') ? 'target="_blank" rel="noopener"' : ''}>${esc(nameOf(i))}</a>
  <div class="chips">${i.label ? `<span class="chip" title="Label">${esc(i.label)}</span>` : ''}${meta(i)}${i.kind === 'draft' || isPull(i) || (i.kind === 'issue' && GH_TICKET.test(i.url || '')) ? devinBits(i.url) : ''}${teamsAuthor(i)}${extra}${snoozeBits(i)}<button class="ibtn" data-edit="${esc(i.id)}" title="Rename / label">✎</button></div></div>`;
};
const chip = (t, c = '') => t ? `<span class="chip ${c}">${esc(t)}</span>` : '';

const isPull = (i) => /^https:\/\/github\.com\/[\w.-]+\/[\w.-]+\/pull\/\d+/i.test(i.url || '') && i.kind !== 'issue';
// Devin review of a PR: run state, the session(s) it produced, and the trigger button
const devinBits = (url) => {
  if (!GH_TICKET.test(url || '')) return '';
  const pr = url.replace(/[#?].*$/, ''), r = S.runs?.[pr], c = S.runs?.[`close:${pr}`], pull = /\/pull\//.test(pr);
  const runChip = (x, what) => x ? `<span class="chip ${x.state === 'failed' ? 'late' : 'dim'}" title="${esc(`${x.dir}\n${x.model ? `model: ${x.model}\n` : ''}${x.msg || ''}`)}">${{ running: `Devin ${what}…`, done: x.warn ? `Devin ${what} ended early · session kept` : `Devin ${what} done`, failed: `Devin ${what} failed${x.msg ? `: ${x.msg.slice(0, 70)}` : ''}` }[x.state]}</span>` : '';

      <label>Parent</label><select id="fParent">${opt('', '— root —', w.parent || '')}${others.map((x) => opt(x.slug, x.name, w.parent || '')).join('')}</select>

        <select id="fRelAdd"><option value="">+ link…</option>${others.filter((x) => !rel.has(x.slug)).map((x) => opt(x.slug, x.name, '')).join('')}</select></div>
      <label>GitHub</label><input id="fGh" value="${esc(w.github.join(', '))}" placeholder="repo:owner/name, issue:owner/repo#12">

// ---------- ticket context: a GitHub issue/PR with parent chain, sub-issues, siblings, PRs, dependencies ----------
const GH_TICKET = /^https:\/\/github\.com\/[\w.-]+\/[\w.-]+\/(issues|pull)\/\d+/i;
let ctxStack = []; // urls visited in the drawer, for Back
const onPlate = (url) => S.items.find((i) => i.state !== 'gone' && (i.url || '').replace(/[#?].*$/, '') === url);
async function openCtx(url, push = true) {
  if (push) ctxStack.push(url);
  closeCtx(false);
  const scrim = document.createElement('div'); scrim.className = 'ctx-scrim'; scrim.onclick = () => closeCtx();
  const d = document.createElement('aside'); d.className = 'ctx'; d.innerHTML = '<div class="ctx-top">Ticket context</div><p class="hint">Loading from GitHub…</p>';
  document.body.append(scrim, d);
  const r = await fetch(`/api/gh/context?url=${encodeURIComponent(url)}`), j = await r.json();
  if (!document.body.contains(d)) return;
  d.innerHTML = r.ok ? ctxHtml(j) : `<div class="ctx-top">Ticket context<button class="btn" data-x>Close</button></div><div class="empty">${esc(j.error)}</div>`;
  d.querySelectorAll('[data-go]').forEach((el) => (el.onclick = (e) => { if (!e.target.closest('a, button')) openCtx(el.dataset.go); }));
  d.querySelectorAll('[data-add]').forEach((b) => (b.onclick = async () => {
    const r2 = await post('/api/items/add-github', { url: b.dataset.add, workstream: onPlate(j.ticket.url)?.workstream || null });
    if (r2) { await load(); openCtx(ctxStack.at(-1), false); }
  }));
  wireTeamsChat(d);
  d.querySelector('[data-back]')?.addEventListener('click', () => { ctxStack.pop(); openCtx(ctxStack.at(-1), false); });
  d.querySelector('[data-x]')?.addEventListener('click', () => closeCtx());
}
// Teams chat about a ticket: a deep link that opens a new chat with people, topic and a draft message (no Graph API).

function wireTeamsChat(d) {

      <h2><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.title)}</a></h2>
      <div class="chips">${GH_TICKET.test(t.url || '') ? devinBits(t.url) : ''}${p ? `<span class="chip">▸ ${esc(p.workstream ? wsOf(p.workstream)?.name || p.workstream : 'Inbox')}</span>${chip(p.status)}${chip(p.iteration, 'dim')}` : `<button class="add" data-add="${esc(t.url)}">+ add to plate</button>`}

    ${sec('Sub-issues', subs, subs.length ? ` <span class="prog"><i style="width:${(100 * done) / subs.length}%"></i></span> ${done}/${subs.length}` : '')}

// tiny markdown -> html for transcripts: escapes first, so nothing from the conversation becomes markup; links only http(s)

  const draw = () => {
    const list = dests();
    $('#tDests').innerHTML = list.map((d, n) => `<button class="dest ${n === 0 ? 'first' : ''} ${d.create ? 'new' : ''}" data-n="${n}">${esc(d.name)}</button>`).join('');
    $('#tDests').querySelectorAll('.dest').forEach((b) => (b.onclick = () => { const d = list[b.dataset.n]; moveSel(d.slug || null, d.create); }));
  };
  draw();
  $('#tMove').oninput = draw;
  $('#tMove').onkeydown = (e) => {
    if (e.key === 'Escape') return e.target.blur();
    if (e.key !== 'Enter') return;
    const d = dests()[0]; if (d) moveSel(d.slug || null, d.create);
  };
  $('#tClear').onclick = () => { tsel.clear(); renderPanel(); };
  $('#tDismiss').onclick = () => dismiss([...tsel], tscope !== 'dismissed');
}
// dismiss = hide from the Inbox without classifying (any source: collectors keep the flag); on = false restores
async function dismiss(ids, on = true) {
  const r = await post('/api/dismiss', { ids, dismissed: on });
  if (!r) return;
  ids.forEach((id) => tsel.delete(id)); await load();
  toast(`${on ? 'Dismissed' : 'Restored'} ${r.changed.length}`, async () => { await post('/api/dismiss', { ids: r.changed, dismissed: !on }); load(); });
}
// slug = target workstream; newName = create it first (typed a name that matches nothing); ids = the selection, or what was dragged
async function moveSel(slug, newName, ids = [...tsel]) {
  if (newName) { const c = await post('/api/ws/create', { name: newName, parent: '' }); if (!c) return; slug = c.slug; }
  const r = await post('/api/move', { ids, workstream: slug || null });
  if (!r) return;
  tsel.clear(); await load();
  const undo = async () => {
    const back = new Map(); for (const m of r.moved) back.set(m.from, [...(back.get(m.from) || []), m.id]);
    for (const [from, ids2] of back) await post('/api/move', { ids: ids2, workstream: from });
    load();
  };
  toast(`${newName ? `Created ${newName} · ` : ''}Moved ${r.moved.length} to ${slug ? wsOf(slug)?.name : 'Inbox'}`, undo);
}
// dragging a selected row drags the whole selection; drop targets read this type (else the single id in text/plain)
const DRAG_IDS = 'application/x-plate-ids';
const draggedIds = (e) => { try { return JSON.parse(e.dataTransfer.getData(DRAG_IDS)); } catch { const id = e.dataTransfer.getData('text/plain'); return id ? [id] : []; } };
function wirePanel() {
  // re-rendering replaces the input, so put focus and caret back after each keystroke
  $('#tq').oninput = (e) => { tq = e.target.value; const at = e.target.selectionStart; renderPanel(); const q = $('#tq'); q.focus(); q.setSelectionRange(at, at); };
  $('#tq').onkeydown = (e) => { if (e.key === 'Escape') { e.stopPropagation(); if (tq) { tq = ''; renderPanel(); } else e.target.blur(); } };
  document.querySelectorAll('[data-tscope]').forEach((b) => (b.onclick = () => { tscope = b.dataset.tscope; renderPanel(); }));
  document.querySelectorAll('[data-tkind]').forEach((b) => (b.onclick = () => { tkind = b.dataset.tkind; renderPanel(); }));
  const rows = [...document.querySelectorAll('.trow')], ids = rows.map((r) => r.dataset.tid);
  rows.forEach((r) => (r.onclick = (e) => {
    if (e.target.closest('a[href], [data-ctx], [data-dismiss]')) return; // the title opens the item, the ref its context
    e.preventDefault();
    const id = r.dataset.tid;
    if (e.shiftKey && tlast && ids.includes(tlast)) {
      const [a, b] = [ids.indexOf(tlast), ids.indexOf(id)].sort((x, y) => x - y);
      ids.slice(a, b + 1).forEach((x) => tsel.add(x));
    } else tsel.has(id) ? tsel.delete(id) : tsel.add(id);
    tlast = id; renderPanel();
  }));
  document.querySelectorAll('[data-dismiss]').forEach((b) => (b.onclick = (e) => { e.stopPropagation(); dismiss([b.dataset.dismiss], tscope !== 'dismissed'); }));
  rows.forEach((r) => {
    r.ondragstart = (e) => {
      const ids = tsel.has(r.dataset.tid) ? [...tsel] : [r.dataset.tid];
      e.dataTransfer.setData(DRAG_IDS, JSON.stringify(ids)); e.dataTransfer.setData('text/plain', ids[0]);
      r.classList.add('dragging');
    };
    r.ondragend = () => r.classList.remove('dragging');
  });
  document.querySelectorAll('[data-tgrp]').forEach((h) => (h.onclick = () => {
    const g = [...h.parentElement.querySelectorAll('.trow')].map((r) => r.dataset.tid), all = g.every((x) => tsel.has(x));
    g.forEach((x) => (all ? tsel.delete(x) : tsel.add(x))); renderPanel();
  }));
  triageBar();
}
document.addEventListener('keydown', (e) => {
  if (view !== 'ws' || !panelOpen || e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.('input, select, textarea')) return;
  if (e.key === 'a') { triageList().forEach((i) => tsel.add(i.id)); renderPanel(); }
  else if (e.key === 'm' && tsel.size) { e.preventDefault(); $('#tMove')?.focus(); }
  else if (e.key === 'Escape' && tsel.size) { tsel.clear(); renderPanel(); }
  else if (e.key === 'd' && tsel.size) dismiss([...tsel], tscope !== 'dismissed');
});

// ---------- smart paste: Cmd+V outside a form field adds an item ----------
function classifyPaste(raw) {
  const text = raw.trim(), oneToken = !/\s/.test(text);
  if (oneToken && (/teams\.(microsoft\.com|cloud\.microsoft)\/l\//i.test(text) || /^msteams:/i.test(text))) return { source: 'teams', title: 'Teams conversation', url: text };
  if (oneToken && /^https:\/\/github\.com\/[\w.-]+\/[\w.-]+\/(issues|pull)\/\d+/i.test(text)) return { source: 'ghref', url: text };
  if (oneToken && /^https?:\/\//i.test(text)) {
    let title = text;
    try { const u = new URL(text); const last = decodeURIComponent(u.pathname.split('/').filter(Boolean).pop() || ''); title = u.hostname.replace(/^www\./, '') + (last ? ` › ${last}` : ''); } catch {}
    return { source: 'link', title: title.slice(0, 120), url: text };
  }
  const flat = text.replace(/\s+/g, ' ');
  return { source: 'note', title: flat.slice(0, 200), ...(flat.length > 200 || text.includes('\n') ? { note: text } : {}) };
}
document.addEventListener('paste', async (e) => {
  if (e.target.closest?.('input, textarea, select, [contenteditable]')) return;
  const raw = e.clipboardData?.getData('text/plain') || '';
  if (!raw.trim()) return;
  e.preventDefault();
  const target = view === 'ws' ? selWs : null; // workstream open in the panel, else Inbox
  const item = { ...classifyPaste(raw), workstream: target };
  if (item.source === 'ghref') toast('Looking up the GitHub item…');
  const r = await post(item.source === 'ghref' ? '/api/items/add-github' : '/api/items/add', item);
  if (!r) return;
  await load();
  const where = (slug) => (slug ? wsOf(slug)?.name : 'Inbox');
  if (r.existing) {
    // already on the plate: offer to bring it into the workstream that's open
    if (!target || r.workstream === target) return toast(`Already on your plate, in ${where(r.workstream)}`);
    return toast(`Already in ${where(r.workstream)}`, async () => {
      const m = await post('/api/move', { id: r.id, workstream: target });
      if (m) { await load(); toast(`Moved to ${where(target)}`, async () => { await post('/api/move', { id: r.id, workstream: r.workstream }); load(); }); }
    }, `Move to ${where(target)}`);
  }
  const it = S.items.find((x) => x.id === r.id);
  const label = item.source === 'ghref' ? `${it?.repo}#${it?.number}${r.prs ? ` + ${r.prs} PR${r.prs > 1 ? 's' : ''}` : ''}` : { teams: 'Teams link', link: 'link', note: 'note' }[item.source];
  toast(`Added ${label} to ${where(r.workstream ?? target)}`, async () => { await post('/api/items/remove', { id: r.id }); load(); });
});

load().then(() => {
  const h = new URLSearchParams(location.hash.slice(1)).get('ws');
  if (h && wsOf(h.split(',').pop())) setFocus(h.split(',').pop());
});
</script>
